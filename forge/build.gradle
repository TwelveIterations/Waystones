plugins {
    id 'net.neoforged.moddev.legacyforge'
    id 'maven-publish'
    id 'idea'
    id 'net.darkhax.curseforgegradle'
    id "com.modrinth.minotaur"
}

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")

    if (forge_mixins.toBoolean()) {
        config("${mod_id}.mixins.json")
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }

    runs {
        client {
            client()

            if (forge_mixins.toBoolean()) {
                programArgument "-mixin.config=${mod_id}.mixins.json"
            }

            systemProperty "mixin.env.disableRefMap", "true"
            systemProperty "mixin.debug.export", "true"
            systemProperty "mixin.debug.export.decompile", "false"
            systemProperty "mixin.debug.verbose", "true"
            systemProperty "mixin.debug.dumpTargetOnFailure", "true"
            systemProperty "mixin.checks", "true"
            systemProperty "mixin.hotSwap", "true"
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()

            if (forge_mixins.toBoolean()) {
                programArgument "-mixin.config=${mod_id}.mixins.json"
            }

            systemProperty "mixin.env.disableRefMap", "true"
            systemProperty "mixin.debug.export", "true"
            systemProperty "mixin.debug.export.decompile", "false"
            systemProperty "mixin.debug.verbose", "true"
            systemProperty "mixin.debug.dumpTargetOnFailure", "true"
            systemProperty "mixin.checks", "true"
            systemProperty "mixin.hotSwap", "true"
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = "gameTestServer"

            if (forge_mixins.toBoolean()) {
                programArgument "-mixin.config=${mod_id}.mixins.json"
            }

            systemProperty "mixin.env.disableRefMap", "true"
            systemProperty "mixin.debug.export", "true"
            systemProperty "mixin.debug.export.decompile", "false"
            systemProperty "mixin.debug.verbose", "true"
            systemProperty "mixin.debug.dumpTargetOnFailure", "true"
            systemProperty "mixin.checks", "true"
            systemProperty "mixin.hotSwap", "true"
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()

            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id

            if (forge_mixins.toBoolean()) {
                programArgument "-mixin.config=${mod_id}.mixins.json"
            }

            systemProperty "mixin.env.disableRefMap", "true"
            systemProperty "mixin.debug.export", "true"
            systemProperty "mixin.debug.export.decompile", "false"
            systemProperty "mixin.debug.verbose", "true"
            systemProperty "mixin.debug.dumpTargetOnFailure", "true"
            systemProperty "mixin.checks", "true"
            systemProperty "mixin.hotSwap", "true"

            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        resources {
            srcDirs 'src/generated/resources'
        }
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly project(":common")

    modImplementation "net.blay09.mods:balm-forge:${balm_version}", {
        changing = balm_version.endsWith("SNAPSHOT")
    }

    compileOnly "org.jetbrains:annotations:22.0.0"

    compileOnly "mezz.jei:jei-$jei_minecraft_version-common-api:$jei_version"
    if (jei_minecraft_version == minecraft_version) {
        runtimeOnly "mezz.jei:jei-$jei_minecraft_version-forge:$jei_version"
    }

    compileOnly("me.shedaniel.cloth:cloth-config:$cloth_config_version") {
        transitive = false
    }

    compileOnly "curse.maven:jade-324717:$jade_forge_version"
    compileOnly "mcp.mobius.waila:wthit-api:forge-$wthit_version"
    compileOnly "curse.maven:the-one-probe-245211:$theoneprobe_version"
}

apply from: 'dependencies.gradle'

tasks.named('compileJava', JavaCompile) {
    source(project(":common").sourceSets.main.allSource)
}

def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range,
        forge_loader_version_range: forge_loader_version_range,
        mod_id: mod_id, version: version, balm_version_range: balm_version_range,
]
processResources {
    from project(":common").sourceSets.main.resources

    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_id}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = mod_id + "-forge"
            version = project.version + (!project.version.endsWith("SNAPSHOT") ? "+" + minecraft_version : "")

            artifact reobfJar
        }
    }

    repositories {
        maven {
            var releasesRepoUrl = "https://maven.twelveiterations.com/repository/maven-releases/"
            var snapshotsRepoUrl = "https://maven.twelveiterations.com/repository/maven-snapshots/"
            url = uri(version.toString().endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl)
            name = "maven"
            credentials(PasswordCredentials)
        }
    }
}

task curseforge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    dependsOn('build')
    description = 'Publishes the Forge build to CurseForge.'
    group = 'publishing'

    apiToken = project.findProperty("curseforge.api_key") ?: System.getenv("CURSEFORGE_TOKEN") ?: "none"

    def mainFile = upload(curseforge_project_id, file("${project.buildDir}/libs/${base.archivesName.get()}-${version}.jar"))
    mainFile.changelog = rootProject.file('CHANGELOG.md').text
    mainFile.changelogType = "markdown"
    mainFile.addRequirement("balm")
    project.minecraft_versions.split(',').toList().each { mainFile.addGameVersion(it) }
    mainFile.releaseType = release_type
}

modrinth {
    token = project.findProperty("modrinth.token") ?: System.getenv("MODRINTH_TOKEN") ?: "none"
    projectId = project.modrinth_project_id
    versionType = project.release_type
    versionNumber = project.version + "+forge-" + project.minecraft_version
    uploadFile = reobfJar
    changelog = rootProject.file("CHANGELOG.md").text
    gameVersions = project.minecraft_versions.split(',').toList()
    syncBodyFrom = rootProject.file("modrinth.md").text
    loaders = ['forge']
    dependencies {
        required.project "balm"
    }
}
