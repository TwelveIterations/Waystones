name: manage-labels
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run (no changes, log only)'
        required: false
        default: true
        type: boolean
      remove_missing:
        description: 'Remove labels not present in the source data'
        required: false
        default: false
        type: boolean
jobs:
  manage-labels:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    name: manage-labels
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: TwelveIterations/manage-labels@2eb52a52431a345ad446f03003ba5c50ddf18d08
        with:
          dry: ${{ inputs.dry }}
          remove_missing: ${{ inputs.remove_missing }}
          source: https://raw.githubusercontent.com/TwelveIterations/.github/refs/heads/main/labels.yaml
        env:
          GITHUB_TOKEN: ${{ github.token }}
